[build-system]
requires = ['hatchling==1.27.0']
build-backend = 'hatchling.build'

[project]
name = 'indico-plugin-ecm'
version = '0.1.0'
description = 'ECM accreditation, attendance, credits and certificates for Indico'
readme = 'README.md'
license = 'MIT'
requires-python = '>=3.12.2, <3.13'
dependencies = ['indico>=3.3']

[project.entry-points.'indico.plugins']
ecm = 'indico_ecm.plugin:ECMPlugin'

[tool.hatch.build]
include = ['indico_ecm']
