[build-system]
requires = ['hatchling==1.27.0']
build-backend = 'hatchling.build'

[project]
name = 'indico-plugin-crm'
version = '0.1.0'
description = 'CRM for ECM providers, embedded in Indico'
readme = 'README.md'
license = 'MIT'
requires-python = '>=3.12.2, <3.13'
dependencies = ['indico>=3.3']

[project.entry-points.'indico.plugins']
crm = 'indico_crm.plugin:CRMPlugin'

[tool.hatch.build]
include = ['indico_crm']
